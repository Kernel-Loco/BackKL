# Configuración de gitleaks para este repo (RC-254). La leen solos el pre-commit y el job de
# seguridad de .github/workflows/seguridad.yml, porque gitleaks busca .gitleaks.toml en la raíz.
# No es la del recolector de GitHub: esa es cirdan/recolectores/gitleaks_cirdan.toml y no cambia.
#
# gitleaks 8.21.2 une con OR las rutas y las expresiones de un allowlist (condition = "AND" no
# se respeta), así que la excepción de los tokens falsos va dentro de su propia regla: la regla
# ya exige el prefijo CIRDAN_FAKE_ y su allowlist solo deja pasar pruebas/fixtures/.
#
# Este archivo no lleva [allowlist] global. Con useDefault se le suma la global de gitleaks, que
# trae '(?i)^true|false|null$' sin paréntesis, y tomaría el regexTarget de la propia: con
# regexTarget = "line", una línea con 'false' o que termina en 'null' saltaría cualquier hallazgo
# (comprobado con 8.21.2 el 23 nov). Por eso la excepción de las huellas va dentro de su regla.
# pruebas/gitleaks_autoprueba.py, que corre el job de seguridad, revisa estos casos.

[extend]
useDefault = true

# Un token falso (AGENTS regla 7) fuera de pruebas/fixtures/ pone el job en rojo. Las reglas por
# omisión no lo marcan, porque generic-api-key descarta los valores que dicen 'fake'. El secreto
# de la regla es solo el prefijo (secretGroup = 1): la allowlist global de gitleaks se aplica al
# secreto y saltaría un token falso que trae 'false' o termina en 'null'. El prefijo nunca coincide.
[[rules]]
id = "lowtide-token-falso-fuera-de-fixtures"
description = "Token falso CIRDAN_FAKE_ fuera de pruebas/fixtures/"
regex = '''(CIRDAN_FAKE_)[A-Za-z0-9_-]{8,}'''
secretGroup = 1
keywords = ["cirdan_fake_"]

[rules.allowlist]
paths = ['''^pruebas/fixtures/''']

# Las huellas sha256 de migraciones y semillas que fija pruebas/test_catalogo_reglas.py no son
# secretos: generic-api-key (la de gitleaks, que se queda igual) solo salta la línea con esa forma
# exacta (ruta NNN_nombre.sql y 64 hex). Un id que ya existe en las reglas por omisión les suma
# esta allowlist sin cambiar su regex.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Huellas sha256 de migraciones y semillas"
regexTarget = "line"
regexes = ['''^\s*'db/(?:migraciones|semillas)/\d{3}_[a-z0-9_]+\.sql': '[0-9a-f]{64}',\r?$''']
