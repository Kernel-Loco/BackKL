# El índice donde el token de HEC deja los eventos de LowTide. Cámbialo si tu token usa otro (por ejemplo
# index=lowtide) y agrega ese índice a las macros cim_Vulnerabilities_indexes y cim_Alerts_indexes del CIM.
[lowtide_index]
definition = index=main

# Deja solo los eventos de la última exportación de cada dominio. Va después de una búsqueda que incluya
# sourcetype=lowtide:export, para que un dominio cuya última exportación no trajo hallazgos quede en 0.
[lowtide_ultima_exportacion]
definition = eventstats latest(export_id) AS lowtide_ultima BY domain | where export_id=lowtide_ultima | fields - lowtide_ultima
