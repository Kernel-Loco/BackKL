# Los eventos llegan por HEC (/services/collector/event) ya con los nombres del CIM (cirdan/siem/__init__.py).
# Aquí solo se extraen como JSON al buscar. El momento del evento es el campo `time` de HEC.
[lowtide:finding]
description = Hallazgo abierto de LowTide (CIM Vulnerabilities y, si es crítico, Alerts)
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000

[lowtide:scan]
description = Último escaneo de LowTide con su cobertura parcial
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000

[lowtide:score]
description = Score de riesgo de LowTide (0 a 100) con su banda y el score de cada categoría
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000
