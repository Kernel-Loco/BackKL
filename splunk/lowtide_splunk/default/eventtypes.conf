[lowtide_vulnerability]
search = sourcetype=lowtide:finding
description = Hallazgos de LowTide para el modelo Vulnerabilities del CIM. Cada exportación los vuelve a mandar: deduplica por finding_id o usa la macro lowtide_ultima_exportacion

[lowtide_alert]
search = sourcetype=lowtide:finding severity=critical type=alert
description = Hallazgos críticos de LowTide que aparecieron o se reabrieron en el último escaneo (recurrence=new) o que siguen abiertos y subieron a crítico, para el modelo Alerts del CIM

[lowtide_scan]
search = sourcetype=lowtide:scan
description = Escaneos de LowTide

[lowtide_score]
search = sourcetype=lowtide:score
description = Scores de riesgo de LowTide

[lowtide_export]
search = sourcetype=lowtide:export
description = Una exportación de LowTide por dominio, también sin hallazgos
