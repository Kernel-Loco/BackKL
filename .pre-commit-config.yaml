# Revisión de secretos antes de cada commit con gitleaks.
# Instalación una vez por PC:  pip install pre-commit && pre-commit install
# Revisar todo el historial:   docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
