# Excepciones de Trivy en .github/workflows/imagenes.yml (#82, RC-117). Guía: docs/cadena_de_suministro.md.
# Cada una lleva su razón y su fecha de vencimiento. Al vencer, Trivy vuelve a contarla y el CI frena otra vez.
vulnerabilities:
  - id: CVE-2025-68121
    paths:
      - usr/local/bin/gitleaks
    statement: >-
      gitleaks 8.21.2 se compiló con Go 1.23.2. Subirlo (8.30.1) pide regenerar cirdan/recolectores/gitleaks_cirdan.toml
      y cambiar el pre-commit, el NOTICE y los hash del Dockerfile (#16, RC-50). Va en su propio PR.
    expired_at: 2026-12-04
  - id: CVE-2025-68121
    paths:
      - usr/local/bin/gosu
    statement: >-
      gosu de la imagen oficial postgres:16.15 (y de 16.16) se compiló con un Go viejo. Solo corre al arrancar el
      contenedor para bajar de root a postgres y no recibe tráfico. Se quita al salir una postgres:16 con gosu nuevo.
    expired_at: 2026-12-04
