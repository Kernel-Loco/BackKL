# Despliegue de LowTide (#49, RC-91): la VM y el plan B usan este archivo encima de docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.despliegue.yml up -d --build
# Suma el portal (FrontKL) y Cloudflare Tunnel. Ningún puerto queda abierto a la red: el tráfico entra por el túnel,
# que solo llega al portal, y el portal reenvía /api/v1 a la API (next.config.ts de FrontKL). La API no tiene nombre
# público. En la PC de desarrollo no se usa: sin este archivo todo sigue igual.
#
# Redes:
# - borde: cloudflared y el portal. cloudflared no ve la API, la base ni Valkey.
# - interna: el portal y la API, sin salida a internet. La API sale a internet por la red default.
# Las IP de cloudflared y del portal están fijas para que FORWARDED_ALLOW_IPS no dependa de cómo Docker reparta la subred.
#
# IP del cliente para el bloqueo por intentos del login: Cloudflare agrega la IP real al final de X-Forwarded-For.
# Next no agrega la suya si el encabezado ya viene (base-server.js, `??=`). uvicorn toma, de derecha a izquierda, la
# primera IP que no está en FORWARDED_ALLOW_IPS. Una IP falsa que mande el navegador queda a la izquierda y no cuenta.
# cloudflared está en la lista por si agrega su propia IP al reenviar.

x-registro: &registro
  # Rotación del registro de Docker (comentario 10266 de RC-91): a lo más 30 MB por contenedor.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *registro

  valkey:
    <<: *registro

  api:
    <<: *registro
    environment:
      # Sin esto la API rechaza el login desde https://lowtidesec.com con 403 'Origen no permitido'
      # (cirdan/api/main.py, comentario 10312 de RC-91).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Falta ALLOWED_ORIGINS en .env, por ejemplo https://lowtidesec.com}
      # El despliegue siempre va con HTTPS (Cloudflare): la cookie de sesión solo viaja cifrada.
      COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: "172.31.91.10,172.31.92.11"
      # Nunca en el despliegue, aunque el .env diga otra cosa.
      DEMO_EXPLORER: "false"
    networks:
      default:
      interna:

  demo-accounts:
    <<: *registro
    environment:
      # Las contraseñas y los secretos MFA de las cuentas de demo son públicos (regla 10 de AGENTS.md y
      # comentario 10420 de RC-91). Se comprueba con `docker compose logs demo-accounts`.
      DEMO_ACCOUNTS: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Falta ALLOWED_ORIGINS en .env, por ejemplo https://lowtidesec.com}

  portal:
    <<: *registro
    build:
      # Carpeta de FrontKL junto a BackKL. Otra ruta, con PORTAL_DIR en .env.
      context: ${PORTAL_DIR:-../FrontKL}
      args:
        # Next fija el destino de /api/v1 al compilar (rewrites de next.config.ts).
        API_INTERNAL_URL: http://api:8000
    container_name: cirdan-portal
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      interna:
        ipv4_address: 172.31.91.10
      borde:
        ipv4_address: 172.31.92.10
    init: true
    restart: unless-stopped

  cloudflared:
    <<: *registro
    image: cloudflare/cloudflared:2026.10.7
    container_name: cirdan-cloudflared
    # Túnel administrado desde Cloudflare: los nombres (lowtidesec.com y www) y su destino, http://portal:3000,
    # se configuran en el panel de Zero Trust. Aquí solo va el token del túnel.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN en .env}
    depends_on:
      portal:
        condition: service_healthy
    networks:
      borde:
        ipv4_address: 172.31.92.11
    restart: unless-stopped

networks:
  interna:
    internal: true
    ipam:
      config:
        - subnet: 172.31.91.0/28
  borde:
    ipam:
      config:
        - subnet: 172.31.92.0/28
