# Cirdan en cualquier PC: `docker compose up -d` levanta PostgreSQL 16, Valkey y la API.
# Antes copia .env.example como .env y cambia las contraseñas.
# Todo escucha solo en 127.0.0.1: nada queda expuesto a la red.

services:
  db:
    image: postgres:16.15
    container_name: cirdan-pg16  # las pruebas entran con `docker exec cirdan-pg16`
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      CIRDAN_APP_PASSWORD: ${CIRDAN_APP_PASSWORD:?Falta CIRDAN_APP_PASSWORD en .env}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - cirdan-pg16-data:/var/lib/postgresql/data
      - ./db:/cirdan-db:ro
      - ./db/init/cargar_cirdan.sh:/docker-entrypoint-initdb.d/cargar_cirdan.sh:ro
    healthcheck:
      # Pasa solo cuando terminó la carga inicial y la base `cirdan` acepta conexiones.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d cirdan"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.11
    container_name: cirdan-valkey
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?Falta VALKEY_PASSWORD en .env}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    restart: unless-stopped

  api:
    build: .
    container_name: cirdan-api
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: cirdan
      CIRDAN_APP_PASSWORD: ${CIRDAN_APP_PASSWORD}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      # Llave del MFA: la llave misma en .env (desarrollo, CI y plan B) o, en la VM, la URL del secreto de
      # Azure Key Vault, que la API lee con la identidad administrada (docs/despliegue.md). Una de las dos,
      # nunca las dos: la API lo revisa al arrancar y sin llave no arranca (cirdan/auth/totp.py).
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      TOTP_KEY_VAULT_SECRET_URL: ${TOTP_KEY_VAULT_SECRET_URL:-}
      # Llave de las huellas de contraseña (RC-330), otra que la del MFA y con la misma regla: la llave misma o la URL
      # de su secreto en Key Vault, una de las dos (cirdan/auth/passwords.py).
      PASSWORD_HASH_ENCRYPTION_KEY: ${PASSWORD_HASH_ENCRYPTION_KEY:-}
      PASSWORD_HASH_KEY_VAULT_SECRET_URL: ${PASSWORD_HASH_KEY_VAULT_SECRET_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Dominio al que quedan amarradas las passkeys (RC-331). localhost en tu PC; los orígenes salen de ALLOWED_ORIGINS.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      # De quién se acepta X-Forwarded-For, que da la IP del bloqueo por intentos del login.
      # Por omisión de nadie de fuera del contenedor. El portal (Next) no agrega ese encabezado:
      # pasa tal cual el que mande el navegador, así que con "*" quien llama elige su IP y se
      # salta el bloqueo. Sin proxy, la API ve con una sola IP a todo lo que entra por el puerto
      # publicado (el portal y el host): la puerta de enlace de la red de Docker. Así el bloqueo
      # por IP es uno solo para todos. En el despliegue (#49) va la IP o el CIDR con que la API ve
      # llegar al portal (con el portal en el host, esa puerta de enlace, que da docker network
      # inspect), detrás de un proxy que agregue la IP real al final del encabezado. La subred no
      # está fija: revisa ese valor si se recrea la red. "*" solo para una prueba local.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Dominios que el orquestador puede consultar en vivo (DNS y fuentes). Los de la demo
      # (acme-demo.mx...) no son del equipo: nunca en vivo. En producción, "*".
      DOMINIOS_EN_VIVO: ${DOMINIOS_EN_VIVO:-olmardo.com}
      # Organización de GitHub que cada empresa declaró controlar, con pares dominio=org separados por
      # comas (#16, RC-50). Solo se revisan los repos públicos de la declarada. Un dominio sin par, o con
      # 'ninguna', no consulta GitHub y queda sin cobertura. Hace de campo de la carta hasta la tabla de #64.
      ORGS_GITHUB_DECLARADAS: ${ORGS_GITHUB_DECLARADAS:-olmardo.com=olmardo}
      # Athena sobre el URL Index de Common Crawl para subfinder (RC-184): la llave de un usuario de IAM que solo
      # consulta el workgroup, el workgroup y su carpeta de resultados en S3 (s3://<bucket>/athena/). Sin las 4,
      # subfinder queda en FuenteNoResponde en vivo y al grabar, y reproducir sigue igual.
      CC_ATHENA_ACCESS_KEY_ID: ${CC_ATHENA_ACCESS_KEY_ID:-}
      CC_ATHENA_SECRET_ACCESS_KEY: ${CC_ATHENA_SECRET_ACCESS_KEY:-}
      CC_ATHENA_WORKGROUP: ${CC_ATHENA_WORKGROUP:-}
      CC_ATHENA_SALIDA: ${CC_ATHENA_SALIDA:-}
      # Explorador de la base para la demo (/demo y /db), siempre con sesión (RC-58). Con false
      # esas rutas no existen. Nunca true en producción.
      DEMO_EXPLORER: ${DEMO_EXPLORER:-false}
      # Documentación de la API en /openapi.json, /docs y /redoc. Con false esas rutas no existen. El despliegue la
      # fija en false (comentario 10063 de RC-91).
      API_DOCS: ${API_DOCS:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      demo-accounts:
        condition: service_completed_successfully
    # tini como PID 1: recoge los procesos que deja git cuando el recolector de GitHub lo mata por tiempo (#16).
    init: true
    restart: unless-stopped

  # Corre una vez en cada `up`: con DEMO_ACCOUNTS=true pone contraseña y MFA a las cuentas
  # de la semilla (cirdan/auth/demo.py). Con false las apaga: les vuelve a poner el hash de relleno
  # y les quita el secreto TOTP (#49, RC-91). Nunca true en producción.
  # También las apaga si ALLOWED_ORIGINS trae un origen que no es localhost ni 127.0.0.1 (#169, RC-287),
  # o uno local con barra final o ruta.
  demo-accounts:
    build: .
    command: ["python", "-m", "cirdan.auth.demo"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: cirdan
      CIRDAN_APP_PASSWORD: ${CIRDAN_APP_PASSWORD}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      TOTP_KEY_VAULT_SECRET_URL: ${TOTP_KEY_VAULT_SECRET_URL:-}
      PASSWORD_HASH_ENCRYPTION_KEY: ${PASSWORD_HASH_ENCRYPTION_KEY:-}
      PASSWORD_HASH_KEY_VAULT_SECRET_URL: ${PASSWORD_HASH_KEY_VAULT_SECRET_URL:-}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-false}
      # Vacía cuenta como sin poner: vale la lista local por omisión.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  cirdan-pg16-data:
