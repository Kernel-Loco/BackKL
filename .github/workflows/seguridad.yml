# Seguridad (RC-254): en cada PR a dev o main, y en cada push a esas ramas, revisa secretos en el repo y su historial
# (gitleaks), el código de cirdan/ (bandit), las dependencias de requirements.txt (pip-audit) y el estilo (ruff).
# Ningún paso consulta un dominio: pip-audit solo pregunta a PyPI y a su base de vulnerabilidades por los paquetes del
# repo. dev y main piden este job (seguridad) para fusionar, junto con pruebas y CodeQL.
name: Seguridad

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Todo el historial, no solo el último commit: gitleaks revisa cada commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Antes de revisar la historia, la config se prueba a sí misma sobre un repo de casos que arma al correr (un token
      # falso con 'false' o 'null' en la línea, un gitleaks:allow, las huellas sha256 y pruebas/fixtures/), con la
      # misma imagen. Solo usa la biblioteca estándar de Python.
      - name: gitleaks, autoprueba de .gitleaks.toml
        run: python3 pruebas/gitleaks_autoprueba.py

      # Misma versión que .pre-commit-config.yaml, fijada por digest, por docker y sin red (gitleaks-action pide
      # licencia en organizaciones). --log-opts revisa la historia de lo que se va a fusionar (HEAD), no las demás
      # ramas que trae el checkout. .gitleaksignore guarda los hallazgos falsos de antes de este job, cada uno por
      # commit, y la regla propia de .gitleaks.toml pone en rojo un CIRDAN_FAKE_ fuera de pruebas/fixtures/.
      # Con --ignore-gitleaks-allow, un comentario gitleaks:allow en la línea no salta el hallazgo.
      - name: gitleaks sobre el repo y su historial
        run: |
          docker run --rm --network none -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --ignore-gitleaks-allow --log-opts="--full-history HEAD" --redact --verbose

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      # Versiones fijas, probadas con Python 3.15.
      - name: Instala bandit, pip-audit y ruff
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1 ruff==0.17.5

      # Rojo con cualquier llamada con shell (B602, B604, B605 y B609, sea cual sea su severidad) y con cualquier
      # hallazgo de severidad alta. Lo de severidad baja y media que ya existe sale como aviso en el paso siguiente.
      # Con --ignore-nosec, un comentario # nosec en la línea no salta el hallazgo.
      - name: bandit sobre cirdan/ (shell y severidad alta)
        run: |
          bandit -r cirdan -q --ignore-nosec -t B602,B604,B605,B609
          bandit -r cirdan -q --ignore-nosec --severity-level high

      - name: bandit sobre cirdan/ (todo, como aviso)
        run: bandit -r cirdan -q --ignore-nosec --exit-zero

      # Resuelve requirements.txt con sus dependencias indirectas, que el archivo no fija, y revisa cada versión.
      - name: pip-audit sobre requirements.txt y sus dependencias
        run: pip-audit -r requirements.txt --progress-spinner off

      # Las reglas van fijas para que una versión nueva de ruff no cambie lo que se revisa. Rojo con un error en un .py
      # que agrega o cambia el PR (o el push). En el resto del repo solo avisa: son errores que nadie está tocando,
      # anotados en el README.
      - name: ruff sobre los .py que cambian
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Sin commit base con qué comparar: solo corre el aviso"; exit 0
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASE"...HEAD -- '*.py' > "$RUNNER_TEMP/cambiados"
          if [ ! -s "$RUNNER_TEMP/cambiados" ]; then echo "Ningún .py cambió"; exit 0; fi
          xargs -0 ruff check --no-cache --select E4,E7,E9,F --output-format github < "$RUNNER_TEMP/cambiados"

      - name: ruff sobre todo el repo (aviso)
        run: ruff check --no-cache --select E4,E7,E9,F --output-format github --exit-zero .
