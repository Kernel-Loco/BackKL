# CI mínimo (#11, RC-43): en cada PR a dev o main levanta el compose desde cero, que aplica en orden
# las migraciones db/migraciones/NNN_descripcion.sql y las semillas, y corre las pruebas del README (paso 5).
# El .env se crea en cada corrida con contraseñas al azar: ningún secreto vive en el repo.
# Las pruebas en vivo (EN_VIVO=1) no corren aquí: el CI no consulta fuentes externas.
name: Pruebas

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Migraciones numeradas sin huecos ni repetidas
        run: |
          esperado=1
          for f in db/migraciones/*.sql; do
            nombre=$(basename "$f")
            if ! echo "$nombre" | grep -Eq '^[0-9]{3}_[a-z0-9_]+\.sql$'; then
              echo "::error file=$f::La migración debe llamarse NNN_descripcion.sql"; exit 1
            fi
            numero=$((10#${nombre%%_*}))
            if [ "$numero" -ne "$esperado" ]; then
              echo "::error file=$f::Se esperaba la migración $(printf %03d "$esperado")"; exit 1
            fi
            esperado=$((esperado + 1))
          done
          echo "$((esperado - 1)) migraciones en orden"

      - name: .env de prueba con contraseñas al azar
        run: |
          cp .env.example .env
          al_azar() { python -c "import secrets; print(secrets.token_urlsafe(24))"; }
          for var in POSTGRES_PASSWORD CIRDAN_APP_PASSWORD VALKEY_PASSWORD; do
            sed -i "s|^$var=.*|$var=$(al_azar)|" .env
          done
          llave=$(python -c "import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          sed -i "s|^TOTP_ENCRYPTION_KEY=.*|TOTP_ENCRYPTION_KEY=$llave|" .env
          # Otra llave al azar para las huellas de contraseña (RC-330): la API exige que sea distinta de la del MFA.
          llave=$(python -c "import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          sed -i "s|^PASSWORD_HASH_ENCRYPTION_KEY=.*|PASSWORD_HASH_ENCRYPTION_KEY=$llave|" .env
          grep -q '^PASSWORD_HASH_ENCRYPTION_KEY=.\{44\}$' .env
          # Sin llave anterior de las huellas (RC-333) y sin consultas en vivo a Pwned Passwords (RC-334).
          grep -qx 'PASSWORD_HASH_PREVIOUS_ENCRYPTION_KEY=' .env
          grep -qx 'PWNED_PASSWORDS_ENABLED=' .env
          # .env.example la trae en false (#169, RC-287) y las pruebas entran con las cuentas de demo.
          sed -i "s|^DEMO_ACCOUNTS=.*|DEMO_ACCOUNTS=true|" .env
          grep -qx 'DEMO_ACCOUNTS=true' .env

      # Decisión 3 de RC-40 (docs/servicios_externos.md): con un token 'Public Repo Read-only' de Docker Hub el límite
      # de descargas pasa de 100 a 200 cada 6 h. Los secretos no llegan a los PR de forks, y los de Dependabot salen de
      # sus propios secretos. Sin secreto, o si el login falla, el CI sigue y baja las imágenes sin cuenta, como antes.
      - name: docker login en Docker Hub (se salta sin secreto)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Sin DOCKERHUB_USERNAME o DOCKERHUB_TOKEN: las imágenes se bajan sin cuenta"
            exit 0
          fi
          if ! printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
            echo "::warning::El docker login falló: las imágenes se bajan sin cuenta"
          fi

      - name: Levantar base, Valkey y API (carga migraciones y semillas)
        run: |
          docker compose up -d --build
          for _ in $(seq 60); do
            curl -fs http://127.0.0.1:8000/health && echo && exit 0
            sleep 2
          done
          echo "::error::La API no respondió /health en 2 minutos"; exit 1

      - name: Las migraciones y semillas cargaron sin errores
        run: |
          docker compose logs db | grep -q 'cirdan: base lista'

      # age cifra el respaldo de la base (db/respaldo, RC-233). test_respaldo.py falla si falta, no se salta.
      - name: Instalar age para la prueba del respaldo
        run: sudo apt-get update -q && sudo apt-get install -y -q age

      - name: Pruebas de la base y la API
        run: >-
          python -m unittest pruebas/test_aislamiento.py pruebas/test_dominio_prueba.py pruebas/test_organizacion_lowtide.py pruebas/test_api.py
          pruebas/test_auth.py pruebas/test_alta_totp.py pruebas/test_passkeys.py pruebas/test_escaneos_api.py pruebas/test_api_v1.py pruebas/test_bitacora.py pruebas/test_bitacora_descargas.py pruebas/test_inventario_activos.py pruebas/test_llaves_api.py
          pruebas/test_superadmin.py
          pruebas/test_respaldo.py

      # Integracion de test_github.py corre git y gitleaks reales con gitleaks_cirdan.toml. En el runner se salta,
      # porque no trae gitleaks. Aquí INTEGRACION_GITHUB=1 hace que falle si a la imagen le faltan.
      # Transporte de test_rdap.py hace su certificado con cryptography, que el runner no trae: allí se salta y aquí
      # prueba el transporte, TLS incluido, con el OpenSSL de la imagen. TRANSPORTE_TLS=1 hace que falle si a la
      # imagen le falta (RC-166). SaludoReal de test_visita.py hace lo mismo con el saludo TLS de la visita web: certificados
      # malos y un servidor que solo habla TLS 1.0 o 1.1 (RC-239).
      - name: Pruebas dentro del contenedor (asistente, orquestador, explorador, modelo ML, TXT, cuentas de demo, bloqueo por IP, IP del cliente, cookie Secure, código MFA y logout sin red, tope del cuerpo, llaves del MFA y de las huellas, captcha, documentación de la API, gitleaks, TLS, pesos, ruta del reporte, subfinder sin red y cartas)
        run: >-
          docker compose run --rm -e INTEGRACION_GITHUB=1 -e TRANSPORTE_TLS=1 -e RUTA_REPORTE=1 -e INTEGRACION_SUBFINDER=1 -e ESTADO_CARTA=1 -e CIRDAN_TEST_DB_ISOLATED=true
          -v "$PWD/pruebas:/app/pruebas:ro"
          -v "$PWD/datos/ml:/app/datos/ml:ro" -v "$PWD/db:/app/db:ro" -v "$PWD/docs:/app/docs:ro" -v "$PWD/Dockerfile:/app/Dockerfile:ro"
          api python -m unittest pruebas/test_asistente.py pruebas/test_orquestador.py pruebas/test_explorador.py pruebas/test_modelo_ml.py pruebas/test_anomalias_ml.py pruebas/test_auditoria_humana_ml.py pruebas/test_txt.py
          pruebas/test_demo_cuentas.py pruebas/test_bloqueo_ip.py pruebas/test_ip_cliente.py pruebas/test_cookie_segura.py pruebas/test_login_sin_red.py pruebas/test_tope_cuerpo.py pruebas/test_llave_totp.py pruebas/test_llave_huellas.py
          pruebas/test_captcha.py pruebas/test_documentacion_api.py
          pruebas/test_rotar_huellas.py pruebas/test_contrasenas_filtradas.py
          pruebas.test_github.Integracion
          pruebas.test_rdap.Transporte pruebas.test_crtsh.TopeDeBytes pruebas.test_visita.SaludoReal pruebas/test_pesos_configurables.py pruebas.test_reporte.Ruta
          pruebas.test_subfinder.Integracion pruebas/test_estado_carta.py
          pruebas/test_alta_dominio.py pruebas/test_verificacion_txt_api.py pruebas/test_alta_dominio_integracion.py

      - name: Pruebas sin base ni red
        run: >-
          python -m unittest pruebas/test_criterio.py pruebas/test_motor_score.py pruebas/test_plan_accion.py
          pruebas/test_cambios.py pruebas/test_cobertura.py
          pruebas/test_contrato.py pruebas/test_crtsh.py pruebas/test_certspotter.py pruebas/test_contrato_api.py
          pruebas/test_catalogo_reglas.py pruebas/test_subfinder.py pruebas/test_registros_dns.py
          pruebas/test_github.py pruebas/test_shodan.py pruebas/test_rdap.py pruebas/test_geoip.py pruebas/test_borde.py
          pruebas/test_huellas.py pruebas/test_visita.py pruebas/test_api_docs.py pruebas/test_dataset_ml.py
          pruebas/test_contrasenas_comunes.py pruebas/test_identidad.py
          pruebas/test_exportar.py pruebas/test_reporte.py pruebas/test_politica_seguridad.py pruebas/test_plan_zap.py pruebas/test_siem.py pruebas/test_despliegue.py
          pruebas/test_ci.py pruebas/test_cadena_suministro.py pruebas/test_terraform.py
      # RC-313, punto 3b: con la base a las 20:00 de México y la API en UTC, GET /api/v1/domains da 'missing' a una carta
      # que empieza mañana. La base se levanta otra vez con libfaketime (pruebas/hora_base) en las 02:00 UTC de hoy, que
      # son las 20:00 de México de ayer. La API no cambia y queda un día delante. Va al final porque deja la base con otra
      # imagen y otro reloj, sobre el mismo volumen.
      - name: Hora de la base fijada a las 20:00 de México
        run: |
          PG_IMAGE=$(docker compose config --images db)
          FAKETIME_BASE=$(printf '%+ds' $(( $(TZ=UTC date -d 'today 02:00' +%s) - $(date +%s) )))
          export PG_IMAGE FAKETIME_BASE
          echo "Imagen $PG_IMAGE con el reloj de la base movido $FAKETIME_BASE"
          docker compose -f docker-compose.yml -f pruebas/hora_base/docker-compose.yml up -d --build --wait db
          HORA_BASE_FIJA=1 python -m unittest -v pruebas.test_api_v1.ApiV1.test_1c_carta_que_empieza_manana_con_la_base_a_las_20 \
            2>&1 | tee hora_base.log
          # Sin pipefail el código de salida es el de tee: pasa solo con 'OK' a secas, sin 'skipped'.
          grep -qx 'OK' hora_base.log

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Apagar y borrar la base de prueba
        if: always()
        run: docker compose down -v

  # Infraestructura como código (#81, RC-132): formato, validación sin nube (init -backend=false no crea nada ni pide
  # cuenta de Azure) y Trivy sin hallazgos altos ni críticos en la configuración. Imágenes con versión fija.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Terraform fmt y validate
        run: |
          tf() { docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra/terraform:/tf" -w /tf hashicorp/terraform:1.17.2 "$@"; }
          tf fmt -check -recursive -diff
          tf init -backend=false -input=false -lockfile=readonly
          tf validate

      - name: Trivy revisa la configuración de Terraform
        run: >-
          docker run --rm -v "$PWD/infra/terraform:/src:ro" aquasec/trivy:0.76.2
          config --severity HIGH,CRITICAL --exit-code 1 /src
