# Dependabot revisa cada semana las librerías de Python, las imágenes de Docker
# (Dockerfile y docker-compose.yml) y las acciones de GitHub, y abre un PR a dev
# cuando hay una versión nueva.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Los cambios menores y de parche van juntos en un PR, porque dos PR sueltos chocan
    # en líneas vecinas de requirements.txt (scikit-learn y pandas, 14 nov). Los mayores
    # siguen en su propio PR. scikit-learn y joblib van aparte: modelo_v1.joblib se guarda
    # con una versión dada y al subirlas hay que volver a guardarlo.
    groups:
      pip:
        patterns: ["*"]
        exclude-patterns: ["scikit-learn", "joblib"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      # Un salto mayor de postgres no abre el volumen de la base y valkey se queda en la 8.
      # Eso se decide aparte, no con un PR de Dependabot.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: valkey/valkey
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
