# Dependabot revisa cada semana las librerías de Python, las imágenes de Docker
# y las acciones de GitHub, y abre un PR a dev cuando hay una versión nueva.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
